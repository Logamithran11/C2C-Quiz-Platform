{% extends 'base.html' %}
{% block title %}Create an account{% endblock %}
{% block content %}<section class="auth-layout"><div class="auth-intro"><span class="eyebrow">FOR QUIZ CREATORS</span><h1>Inspire your<br>next classroom.</h1><p>Create, share, and understand student progress from one simple dashboard.</p></div><div class="card auth-card"><h2>Create your account</h2><p class="muted">Already a creator? <a href="{{ url_for('login') }}">Log in</a></p><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Your name<input name="name" autocomplete="name" maxlength="100" required></label><label>Email address<input name="email" type="email" autocomplete="email" maxlength="254" required></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><small>Use 8–128 characters.</small></label><label>Confirm password<input name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><button class="button" type="submit">Create account</button></form></div></section>{% endblock %}
