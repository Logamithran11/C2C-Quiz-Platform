services:
  - type: web
    name: c2c-quiz-platform
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: c2c-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
    
databases:
  - name: c2c-postgres
    databaseName: c2cdb
    user: c2cuser
